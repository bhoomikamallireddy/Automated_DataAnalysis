sonar.projectKey=bhoomikamallireddy_Automated_DataAnalysis
sonar.organization=bhoomikamallireddy
sonar.host.url=https://sonarcloud.io

# Default AutoEDA scan
sonar.sources=backend/api,backend/core,frontend/app,frontend/components,frontend/hooks,frontend/utils,frontend/constants

# Source files to analyze
sonar.inclusions=backend/api/**/*.py,backend/core/**/*.py,frontend/app/**/*.js,frontend/app/**/*.jsx,frontend/app/**/*.ts,frontend/app/**/*.tsx,frontend/components/**/*.js,frontend/components/**/*.jsx,frontend/components/**/*.ts,frontend/components/**/*.tsx,frontend/hooks/**/*.js,frontend/hooks/**/*.jsx,frontend/hooks/**/*.ts,frontend/hooks/**/*.tsx,frontend/utils/**/*.js,frontend/utils/**/*.jsx,frontend/utils/**/*.ts,frontend/utils/**/*.tsx,frontend/constants/**/*.js,frontend/constants/**/*.jsx,frontend/constants/**/*.ts,frontend/constants/**/*.tsx

# Test locations
sonar.tests=backend/api,frontend/tests

# Test file patterns
sonar.test.inclusions=backend/api/tests.py,backend/api/test_*.py,backend/api/**/*_tests.py,frontend/tests/**/*.js,frontend/tests/**/*.jsx,frontend/tests/**/*.ts,frontend/tests/**/*.tsx,frontend/**/__tests__/**/*.js,frontend/**/__tests__/**/*.jsx,frontend/**/__tests__/**/*.ts,frontend/**/__tests__/**/*.tsx,frontend/**/test_*.js,frontend/**/test_*.jsx,frontend/**/test_*.ts,frontend/**/test_*.tsx

# Exclude dependencies, generated files, and tests from issue analysis
sonar.exclusions=**/*.zip,**/node_modules/**,**/venv/**,**/.env,**/migrations/**,**/dist/**,**/.next/**,**/coverage/**,**/__pycache__/**,backend/**/tests.py,backend/**/test_*.py,backend/**/*_tests.py,frontend/**/tests/**,frontend/**/__tests__/**,frontend/**/test_*.js,frontend/**/test_*.jsx,frontend/**/test_*.ts,frontend/**/test_*.tsx

# Coverage exclusions
sonar.coverage.exclusions=backend/manage.py,backend/core/asgi.py,backend/core/wsgi.py,backend/core/settings.py,backend/core/test_settings.py,backend/conftest.py,frontend/**

# Python coverage report
sonar.python.coverage.reportPaths=backend/coverage.xml

# Language settings
sonar.python.version=3.11
sonar.javascript.environments=browser,node

